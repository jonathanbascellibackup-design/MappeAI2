    /**
     * ============================================================================
     * 1. SYSTEM PROMPT PER L'AI GROQ (ISTRUZIONI JSON A MATRIOSKA)

     */
    const GROQ_SYSTEM_PROMPT = `Sei un esperto di mappe concettuali visive. Il tuo compito è trasformare il testo fornito dall'utente in una mappa concettuale gerarchica (ad albero radiale) restituendo ESCLUSIVAMENTE un oggetto JSON valido, senza alcun testo introduttivo, commento o blocco markdown.

REGOLE RIGIDE DELLA STRUTTURA JSON ("A MATRIOSKA"):
1. Usa PAROLE REALI e concetti sintetici estratti dal testo (2-4 parole per nodo). NON usare MAI lettere segnaposto come "X", "Y", "Z".
2. Ogni nodo è una chiave JSON il cui valore è un oggetto.
3. NON creare MAI una chiave chiamata "collegamenti", "children" o "figli". Per collegare un nodo figlio a un nodo padre, inserisci l'oggetto del nodo figlio DIRETTAMENTE dentro l'oggetto del nodo padre, separato da una virgola dalle altre chiavi.
4. Ogni nodo DEVE contenere la chiave "type" nel formato esatto:
   "{forma}_{R}.{G}.{B}"
   dove {R}, {G}, {B} sono numeri interi tra 0 e 255 separati da un punto (esempio: "esagono_allungato_37.99.235").

REGOLE SU FORME E COLORI:
- "esagono_allungato": usalo ESCLUSIVAMENTE per l'unico nodo radice centrale (il titolo principale della mappa). Esempio: "esagono_allungato_30.64.175".
- "cerchio": usalo per i rami principali (livello 1) e i concetti intermedi (livello 2). Esempio: "cerchio_16.185.129".
- "quadrato": usalo per i dettagli specifici, esempi e nodi terminali (foglie). Esempio: "quadrato_245.158.11".
- Usa una palette armoniosa e ben contrastata (colori pieni e leggibili, assegnando colori coerenti per ciascun ramo principale).

REGOLE TOPOLOGICHE (MOLTI COLLEGAMENTI MA ORDINATI):
- Crea una mappa ricca con 4-6 rami principali che partono dal titolo centrale, ciascuno ramificato su 2 o 3 livelli di profondità (totale 15-28 nodi).
- Organizza i concetti rigorosamente ad albero gerarchico senza ripetere gli stessi nodi su rami diversi, così la disposizione radiale non avrà mai linee intrecciate.
- Assicurati che nello stesso oggetto padre non ci siano due chiavi figli con lo stesso identico nome.

      },

        "Sintesi Glucosio": { "type": "quadrato_180.83.9" }
      }
    }
  }
}`;

    /**

    /**
     * ============================================================================
     * 4. PARSING DEL JSON A MATRIOSKA
     * ============================================================================
     */
    function parseNodeType(typeStr, depth) {
      let defaultShape = depth === 0 ? 'esagono_allungato' : (depth === 1 ? 'cerchio' : 'quadrato');
      let r = depth === 0 ? 37 : (depth === 1 ? 16 : 245);
      let g = depth === 0 ? 99 : (depth === 1 ? 185 : 158);
      let b = depth === 0 ? 235 : (depth === 1 ? 129 : 11);

      if (typeof typeStr === 'string' && typeStr.trim().length > 0) {
        const clean = typeStr.trim().toLowerCase();
        const rgbMatch = clean.match(/(\d{1,3})\.(\d{1,3})\.(\d{1,3})$/);
        if (rgbMatch) {
          r = Math.min(255, Math.max(0, parseInt(rgbMatch[1], 10)));
          g = Math.min(255, Math.max(0, parseInt(rgbMatch[2], 10)));
          b = Math.min(255, Math.max(0, parseInt(rgbMatch[3], 10)));
        }

        if (clean.includes('esagono')) {
          defaultShape = 'esagono_allungato';
        } else if (clean.includes('cerchio') || clean.includes('circle')) {
          defaultShape = 'cerchio';
        } else if (clean.includes('quadrato') || clean.includes('square') || clean.includes('rect')) {
          defaultShape = 'quadrato';
        }
      }

      if (depth === 0) {
        defaultShape = 'esagono_allungato';
      }

      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const textColor = luminance > 0.62 ? '#0f172a' : '#ffffff';
      const strokeColor = `rgb(${Math.max(0, r - 28)}, ${Math.max(0, g - 28)}, ${Math.max(0, b - 28)})`;

      return {
        shape: defaultShape,
        fill: `rgb(${r}, ${g}, ${b})`,
        stroke: strokeColor,
        textColor
      };
    }

    function buildTreeFromMatrioska(rawObj) {
      if (!rawObj || typeof rawObj !== 'object' || Array.isArray(rawObj)) {
        throw new Error('Il JSON deve essere un oggetto con una chiave radice.');
      }

      const rootKeys = Object.keys(rawObj).filter(k => k.toLowerCase() !== 'type' && k.toLowerCase() !== 'tipe');
      if (rootKeys.length === 0) {
        throw new Error('Nessun nodo radice trovato nel JSON.');
      }

      let rootLabel = rootKeys[0];
      let rootContent = rawObj[rootLabel];

      if (rootKeys.length > 1) {
        rootLabel = 'Mappa Concettuale';
        rootContent = { type: 'esagono_allungato_37.99.235', ...rawObj };
      }

      function traverse(label, nodeObj, depth) {
        const safeObj = (nodeObj && typeof nodeObj === 'object') ? nodeObj : {};
        const typeVal = safeObj.type || safeObj.Type || safeObj.Tipe || safeObj.tipe || '';
        const visual = parseNodeType(typeVal, depth);

        const children = [];
        for (const [key, val] of Object.entries(safeObj)) {
          if (['type', 'Type', 'Tipe', 'tipe'].includes(key)) continue;
          if (val && typeof val === 'object' && !Array.isArray(val)) {
            children.push(traverse(key, val, depth + 1));
          }
        }

        const lines = wrapText(label, visual.shape === 'esagono_allungato' ? 18 : 14);
        const dims = computeNodeDimensions(lines, visual.shape);

        const node = {
          label,
          lines,
          depth,
          visual,
          dims,
          children,
          weight: 1,
          x: 0,
          y: 0,
          angle: 0
        };

        if (children.length > 0) {
          node.weight = children.reduce((acc, c) => acc + c.weight, 0);
        }

        return node;
      }

      return traverse(rootLabel, rootContent, 0);
    }

    function wrapText(text, maxCharsPerLine) {
      const words = String(text).trim().split(/\s+/);
      const lines = [];
      let currentLine = '';

      for (const word of words) {
        if (!currentLine) {
          currentLine = word;
        } else if ((currentLine + ' ' + word).length <= maxCharsPerLine) {
          currentLine += ' ' + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      if (currentLine) lines.push(currentLine);
      return lines.slice(0, 4);
    }

    function computeNodeDimensions(lines, shape) {
      const maxLen = Math.max(...lines.map(l => l.length), 4);
      const lineCount = lines.length;

      if (shape === 'esagono_allungato') {
        const w = Math.max(190, maxLen * 10.5 + 64);
        const h = Math.max(66, lineCount * 22 + 28);
        return { w, h, r: Math.max(w, h) / 2 };
      }

      if (shape === 'cerchio') {
        const textW = maxLen * 8.2;
        const textH = lineCount * 17;
        const diameter = Math.max(92, Math.hypot(textW, textH) + 28);
        return { w: diameter, h: diameter, r: diameter / 2 };
      }

      const side = Math.max(88, maxLen * 8 + 26, lineCount * 18 + 26);
      return { w: side, h: side * 0.86, r: side / 2 };
    }

    /**
     * ============================================================================
     * 5. MOTORE DI LAYOUT RADIALE
     * ============================================================================
     */
    function layoutRadialTree(root) {
      root.x = 0;
      root.y = 0;

      const levelRadii = [0, 260, 470, 660, 840, 1010];

      function assignPositions(node, startAngle, endAngle) {
        if (!node.children || node.children.length === 0) return;

        const totalWeight = node.children.reduce((sum, c) => sum + c.weight, 0);
        let currentAngle = startAngle;

        for (const child of node.children) {
          const slice = ((endAngle - startAngle) * child.weight) / totalWeight;
          const midAngle = currentAngle + slice / 2;

          const radius = levelRadii[child.depth] || (260 + (child.depth - 1) * 195);
          child.angle = midAngle;
          child.x = Math.cos(midAngle) * radius;
          child.y = Math.sin(midAngle) * radius;

          const padding = Math.min(slice * 0.06, 0.04);
          assignPositions(child, currentAngle + padding, currentAngle + slice - padding);

          currentAngle += slice;
        }
      }

      assignPositions(root, -Math.PI / 2, (3 * Math.PI) / 2);
      resolveSameLevelCollisions(root);
    }

    function resolveSameLevelCollisions(root) {
      const levels = {};
      function collect(node) {
        if (!levels[node.depth]) levels[node.depth] = [];
        levels[node.depth].push(node);
        node.children.forEach(collect);
      }
      collect(root);

      Object.keys(levels).forEach(depthKey => {
        const depth = Number(depthKey);
        if (depth === 0) return;
        const nodes = levels[depth].sort((a, b) => a.angle - b.angle);

        for (let iter = 0; iter < 6; iter++) {
          for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            const b = nodes[(i + 1) % nodes.length];
            if (a === b) continue;

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);
            const minDist = a.dims.r + b.dims.r + 22;

            if (dist < minDist) {
              const radius = Math.hypot(a.x, a.y);
              const deltaAngle = ((minDist - dist) / Math.max(radius, 1)) * 0.55;
              a.angle -= deltaAngle;
              b.angle += deltaAngle;
              a.x = Math.cos(a.angle) * radius;
              a.y = Math.sin(a.angle) * radius;
              b.x = Math.cos(b.angle) * radius;
              b.y = Math.sin(b.angle) * radius;
            }
          }
        }
      });
    }

    /**
     * ============================================================================
     * 6. RENDERING SVG DELLA MAPPA
     * ============================================================================
     */
    function renderMindmap(jsonData) {
      try {
        const tree = buildTreeFromMatrioska(jsonData);
        layoutRadialTree(tree);

        edgesLayer.innerHTML = '';
        nodesLayer.innerHTML = '';

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

        function updateBounds(node) {
          minX = Math.min(minX, node.x - node.dims.w / 2 - 40);
          minY = Math.min(minY, node.y - node.dims.h / 2 - 40);
          maxX = Math.max(maxX, node.x + node.dims.w / 2 + 40);
          maxY = Math.max(maxY, node.y + node.dims.h / 2 + 40);
        }

        function drawEdges(node) {
          for (const child of node.children) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

            const r1 = Math.hypot(node.x, node.y);
            const r2 = Math.hypot(child.x, child.y);
            const midR = (r1 + r2) / 2;

            const cp1x = node.depth === 0
              ? Math.cos(child.angle) * (midR * 0.65)
              : Math.cos(node.angle) * midR;
            const cp1y = node.depth === 0
              ? Math.sin(child.angle) * (midR * 0.65)
              : Math.sin(node.angle) * midR;

            const cp2x = Math.cos(child.angle) * midR;
            const cp2y = Math.sin(child.angle) * midR;

            const d = `M ${node.x.toFixed(1)} ${node.y.toFixed(1)} C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${child.x.toFixed(1)} ${child.y.toFixed(1)}`;

            path.setAttribute('d', d);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', child.visual.fill);
            path.setAttribute('stroke-width', node.depth === 0 ? '3.5' : '2.4');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('opacity', '0.82');

            edgesLayer.appendChild(path);
            drawEdges(child);
          }
        }

        function drawNodes(node) {
          updateBounds(node);

          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('transform', `translate(${node.x.toFixed(1)}, ${node.y.toFixed(1)})`);
          g.setAttribute('filter', 'url(#nodeShadow)');

          const { w, h, r } = node.dims;
          const { shape, fill, stroke, textColor } = node.visual;

          if (shape === 'esagono_allungato') {
            const hw = w / 2;
            const hh = h / 2;
            const tip = 24;
            const points = [
              `${-hw + tip},${-hh}`,
              `${hw - tip},${-hh}`,
              `${hw},0`,
              `${hw - tip},${hh}`,
              `${-hw + tip},${hh}`,
              `${-hw},0`
            ].join(' ');

            const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            poly.setAttribute('points', points);
            poly.setAttribute('fill', fill);
            poly.setAttribute('stroke', stroke);
            poly.setAttribute('stroke-width', '3');
            g.appendChild(poly);
          } else if (shape === 'cerchio') {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '0');
            circle.setAttribute('cy', '0');
            circle.setAttribute('r', r.toFixed(1));
            circle.setAttribute('fill', fill);
            circle.setAttribute('stroke', stroke);
            circle.setAttribute('stroke-width', '2.5');
            g.appendChild(circle);
          } else {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', (-w / 2).toFixed(1));
            rect.setAttribute('y', (-h / 2).toFixed(1));
            rect.setAttribute('width', w.toFixed(1));
            rect.setAttribute('height', h.toFixed(1));
            rect.setAttribute('rx', '12');
            rect.setAttribute('ry', '12');
            rect.setAttribute('fill', fill);
            rect.setAttribute('stroke', stroke);
            rect.setAttribute('stroke-width', '2.2');
            g.appendChild(rect);
          }

          const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textEl.setAttribute('text-anchor', 'middle');
          textEl.setAttribute('fill', textColor);
          textEl.setAttribute('font-family', 'Inter, sans-serif');
          textEl.setAttribute('font-weight', node.depth === 0 ? '700' : (node.depth === 1 ? '600' : '500'));
          textEl.setAttribute('font-size', node.depth === 0 ? '15' : (node.depth === 1 ? '12.5' : '11.5'));

          const lineHeight = node.depth === 0 ? 19 : 15;
          const totalTextHeight = (node.lines.length - 1) * lineHeight;
          const startY = -totalTextHeight / 2 + 4;

          node.lines.forEach((line, idx) => {
            const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
            tspan.setAttribute('x', '0');
            tspan.setAttribute('y', (startY + idx * lineHeight).toFixed(1));
            tspan.textContent = line;
            textEl.appendChild(tspan);
          });

          g.appendChild(textEl);
          nodesLayer.appendChild(g);

          node.children.forEach(drawNodes);
        }

        drawEdges(tree);
        drawNodes(tree);

        mapBounds = {
          minX,
          minY,
          maxX,
          maxY,
          width: Math.max(600, maxX - minX),
          height: Math.max(500, maxY - minY)
        };

        // Dimensiona l'SVG in modo che se si fa zoom o se la mappa è ampia compaiano anche le barre di scorrimento
        mindmapSvg.style.minWidth = Math.max(900, Math.round(mapBounds.width * 1.15)) + 'px';
        mindmapSvg.style.minHeight = Math.max(700, Math.round(mapBounds.height * 1.15)) + 'px';

        currentMapData = jsonData;
        jsonEditor.value = JSON.stringify(jsonData, null, 2);
        fitMapToScreen();
      } catch (err) {
        showStatus('Errore nella struttura del JSON: ' + err.message, 'error');
      }
    }

    /**
     * ============================================================================
     * 7. ZOOM, PAN E ADATTAMENTO ALLO SCHERMO
     * ============================================================================
     */
    function applyTransform() {
      viewportGroup.setAttribute(
        'transform',
        `translate(${viewState.x.toFixed(1)}, ${viewState.y.toFixed(1)}) scale(${viewState.scale.toFixed(3)})`
      );
      zoomBadge.textContent = Math.round(viewState.scale * 100) + '%';
    }

    function fitMapToScreen() {
      const rect = mapViewport.getBoundingClientRect();
      const vw = rect.width || 800;
      const vh = rect.height || 600;

      const scaleX = (vw * 0.9) / mapBounds.width;
      const scaleY = (vh * 0.9) / mapBounds.height;
      viewState.scale = Math.min(1.2, Math.max(0.25, Math.min(scaleX, scaleY)));

      const centerX = (mapBounds.minX + mapBounds.maxX) / 2;
      const centerY = (mapBounds.minY + mapBounds.maxY) / 2;

      viewState.x = vw / 2 - centerX * viewState.scale;
      viewState.y = vh / 2 - centerY * viewState.scale;
      applyTransform();
    }

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      viewState.scale = Math.min(3.5, viewState.scale * 1.2);
      applyTransform();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      viewState.scale = Math.max(0.2, viewState.scale / 1.2);
      applyTransform();
    });

    document.getElementById('btnResetView').addEventListener('click', fitMapToScreen);

    // Zoom con rotellina quando si tiene premuto Ctrl/Cmd o Shift, altrimenti scorrimento naturale
    mapViewport.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey || e.shiftKey) {
        e.preventDefault();
        const rect = mapViewport.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        const newScale = Math.min(3.5, Math.max(0.2, viewState.scale * factor));

        viewState.x = mx - ((mx - viewState.x) / viewState.scale) * newScale;
        viewState.y = my - ((my - viewState.y) / viewState.scale) * newScale;
        viewState.scale = newScale;
        applyTransform();
      }
    }, { passive: false });

    function startDrag(clientX, clientY) {
      viewState.isDragging = true;
      viewState.startX = clientX - viewState.x;
      viewState.startY = clientY - viewState.y;
    }

    function moveDrag(clientX, clientY) {
      if (!viewState.isDragging) return;
      viewState.x = clientX - viewState.startX;
      viewState.y = clientY - viewState.startY;
      applyTransform();
    }

    function endDrag() {
      viewState.isDragging = false;
    }

    mapViewport.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    mapViewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    mapViewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    mapViewport.addEventListener('touchend', endDrag);

    window.addEventListener('resize', fitMapToScreen);

    /**
     * ============================================================================
     * 8. MODELLI GROQ E GENERAZIONE MAPPA
     * ============================================================================
     */
    async function refreshGroqModels() {
      try {
        showStatus('Recupero modelli disponibili da Groq...', 'info');
        const res = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { 'Authorization': `Bearer ${getGroqApiKey()}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);

        const models = (data.data || [])
          .map(m => m.id)
          .filter(Boolean)
          .sort();

        if (models.length > 0) {
          const prev = modelSelect.value;
          modelSelect.innerHTML = '';
          models.forEach(id => {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = id;
            modelSelect.appendChild(opt);
          });
          if (models.includes(prev)) modelSelect.value = prev;
          showStatus(`Caricati ${models.length} modelli Groq.`, 'success');
        }
      } catch (err) {
        showStatus('Impossibile aggiornare i modelli: ' + err.message, 'error');
      }
    }

    btnRefreshModels.addEventListener('click', refreshGroqModels);

    async function generateMapWithGroq() {
      const apiKey = getGroqApiKey();
      const text = sourceText.value.trim();
      const model = getActiveModel();

      if (!text) {
        showStatus('Inserisci prima un testo da trasformare in mappa concettuale.', 'error');
        return;
      }

      if (!model) {
        showStatus('Seleziona o inserisci un ID modello valido.', 'error');
        return;
      }

      btnGenerateAi.disabled = true;
      spinnerIcon.classList.remove('hidden');
      btnGenerateLabel.textContent = 'Generazione in corso...';
      statusBanner.classList.add('hidden');

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model,
            messages: [
              { role: 'system', content: GROQ_SYSTEM_PROMPT },
              {
                role: 'user',
                content: `Crea una mappa concettuale ricca e ben ramificata (senza intrecciare i rami) partendo da questo testo:\n\n${text}`
              }
            ],
            response_format: { type: 'json_object' },
            temperature: 0.25,
            max_tokens: 3000
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const errMsg = data?.error?.message || `Errore HTTP ${response.status}`;
          throw new Error(errMsg);
        }

        const rawContent = data.choices?.[0]?.message?.content;
        if (!rawContent) {
          throw new Error('Risposta vuota dal modello Groq.');
        }

        const cleanedJsonStr = rawContent
          .replace(/^```json\s*/i, '')
          .replace(/^```\s*/i, '')
          .replace(/```$/i, '')
          .trim();

        const parsedJson = JSON.parse(cleanedJsonStr);
        renderMindmap(parsedJson);
        showStatus('Mappa concettuale generata con successo!', 'success');
      } catch (err) {
        showStatus('Errore durante la generazione: ' + err.message, 'error');
      } finally {
        btnGenerateAi.disabled = false;
        spinnerIcon.classList.add('hidden');
        btnGenerateLabel.textContent = 'Genera Mappa con AI';
      }
    }

    btnGenerateAi.addEventListener('click', generateMapWithGroq);

    btnDemoMap.addEventListener('click', () => {
      renderMindmap(DEMO_MAP_JSON);
      showStatus('Mappa dimostrativa caricata.', 'info');
    });

    document.getElementById('btnLoadSampleText').addEventListener('click', () => {
      sourceText.value = "L'Impero Romano nacque nel 27 a.C. con Ottaviano Augusto dopo la crisi della Repubblica. Si espanse su tutto il bacino del Mediterraneo grazie a un esercito professionale, una rete stradale efficiente e il diritto romano. L'epoca d'oro fu la Pax Romana sotto gli imperatori adottivi come Traiano e Adriano. Dal III secolo iniziò una profonda crisi dovuta a instabilità politica, pressione dei popoli germanici ai confini e difficoltà economiche, che portò alla divisione tra Impero d'Occidente e d'Oriente e alla caduta dell'Occidente nel 476 d.C.";
    });

    /**
     * ============================================================================
     * 9. EDITOR JSON MANUALE
     * ============================================================================
     */
    btnToggleJson.addEventListener('click', () => {
      jsonDrawer.classList.toggle('hidden');
    });

    btnCloseJson.addEventListener('click', () => {
      jsonDrawer.classList.add('hidden');
    });

    btnFormatJson.addEventListener('click', () => {
      try {
        const obj = JSON.parse(jsonEditor.value);
        jsonEditor.value = JSON.stringify(obj, null, 2);
      } catch (e) {
        showStatus('JSON non valido: ' + e.message, 'error');
      }
    });

    btnApplyJson.addEventListener('click', () => {
      try {
        const obj = JSON.parse(jsonEditor.value);
        renderMindmap(obj);
        showStatus('Mappa aggiornata dal JSON modificato!', 'success');
      } catch (e) {
        showStatus('Errore di sintassi nel JSON: ' + e.message, 'error');
      }
    });

    /**
     * ============================================================================
     * 10. ESPORTAZIONE PNG E PDF
     * ============================================================================
     */
    function exportSvgToCanvas(scaleFactor = 2.5) {
      return new Promise((resolve, reject) => {
        try {
          const clonedSvg = mindmapSvg.cloneNode(true);
          const clonedGroup = clonedSvg.querySelector('#viewportGroup');
          clonedGroup.removeAttribute('transform');

          const pad = 50;
          const vx = mapBounds.minX - pad;
          const vy = mapBounds.minY - pad;
          const vw = mapBounds.width + pad * 2;
          const vh = mapBounds.height + pad * 2;

          clonedSvg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
          clonedSvg.setAttribute('width', Math.round(vw * scaleFactor));
          clonedSvg.setAttribute('height', Math.round(vh * scaleFactor));

          const bgRect = document.createElementNS('[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)', 'rect');
          bgRect.setAttribute('x', vx);
          bgRect.setAttribute('y', vy);
          bgRect.setAttribute('width', vw);
          bgRect.setAttribute('height', vh);
          bgRect.setAttribute('fill', '#ffffff');
          clonedSvg.insertBefore(bgRect, clonedSvg.firstChild);

          const serializer = new XMLSerializer();
          const svgString = serializer.serializeToString(clonedSvg);
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);

          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(vw * scaleFactor);
            canvas.height = Math.round(vh * scaleFactor);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            resolve(canvas);
          };
          img.onerror = (err) => {
            URL.revokeObjectURL(url);
            reject(err);
          };
          img.src = url;
        } catch (err) {
          reject(err);
        }
      });
    }

    btnDownloadPng.addEventListener('click', async () => {
      try {
        showStatus('Esportazione PNG in corso...', 'info');
        const canvas = await exportSvgToCanvas(2.5);
        const link = document.createElement('a');
        link.download = 'mappa-concettuale.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showStatus('PNG scaricato!', 'success');
      } catch (err) {
        showStatus('Errore durante il download PNG: ' + err.message, 'error');
      }
    });

    btnDownloadPdf.addEventListener('click', async () => {
      try {
        showStatus('Creazione PDF in corso...', 'info');
        const canvas = await exportSvgToCanvas(2.5);
        const imgData = canvas.toDataURL('image/png');

        const { jsPDF } = window.jspdf;
        const isLandscape = canvas.width >= canvas.height;
        const pdf = new jsPDF({
          orientation: isLandscape ? 'landscape' : 'portrait',
          unit: 'mm',
          format: 'a4'
        });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const margin = 10;
        const availW = pageW - margin * 2;
        const availH = pageH - margin * 2;

        const ratio = Math.min(availW / canvas.width, availH / canvas.height);
        const finalW = canvas.width * ratio;
        const finalH = canvas.height * ratio;
        const offsetX = (pageW - finalW) / 2;
        const offsetY = (pageH - finalH) / 2;

        pdf.addImage(imgData, 'PNG', offsetX, offsetY, finalW, finalH);
        pdf.save('mappa-concettuale.pdf');
        showStatus('PDF scaricato!', 'success');
      } catch (err) {
        showStatus('Errore durante il download PDF: ' + err.message, 'error');
      }
    });

    window.addEventListener('load', () => {
      renderMindmap(DEMO_MAP_JSON);
    });
  </script>
